# riscv-config ISA description of the rvntt core, for RISCOF (plan A10).
#
# This is the machine-readable statement of what the core claims to implement,
# and RISCOF uses it to DECIDE WHICH TESTS TO RUN.  Overstating it is the
# classic way to get a green compliance report that means nothing: claim M and
# the multiply tests are selected and fail; claim Zifencei and fence_i is
# selected and fails.  Understating it silently drops coverage instead.
#
# So this file says exactly rv32i_zicsr, machine mode only -- the same string
# the toolchain, Spike and docs/RISC-V_NTT.txt 1.5 all use.
hart_ids: [0]
hart0:
  ISA: RV32IZicsr
  physical_addr_sz: 32
  User_Spec_Version: '2.3'
  supported_xlen: [32]
  misa:
    reset-val: 0x40000100      # MXL = 1 (RV32), extension bit I
    rv32:
      accessible: true
      mxl:
        implemented: true
        type:
          warl:
            dependency_fields: []
            legal:
              - mxl[1:0] in [0x1]
            wr_illegal:
              - Unchanged
      extensions:
        implemented: true
        type:
          warl:
            dependency_fields: []
            legal:
              - extensions[25:0] bitmask [0x0000100, 0x0000000]
            wr_illegal:
              - Unchanged
  # There is no PMP node.  Plan 1.5 excludes PMP, rvntt_csr.sv has neither
  # pmpcfg* nor pmpaddr*, and accessing one is an illegal-instruction trap.
  # riscv-config 3.18 has no `PMP` key at all -- it spells the granularity
  # `pmp_granularity` and describes the registers individually -- so absence is
  # how "not implemented" is expressed, not a negative claim.
