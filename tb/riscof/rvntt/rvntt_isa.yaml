# riscv-config ISA description of the rvntt core, for RISCOF.  RISCOF uses it
# to decide which tests to run, so it says exactly what the core implements:
# RV32IMZicsr_Zicond_Zba_Zbb_Zbkb_Zbs_Zkr_Zkt, machine mode only.
#
# The order is not arbitrary: riscv-config 3.18.3 requires Zbs after Zbkb and
# rejects the `B` letter outright.  The arch-test B directory ships clmul,
# clmulh and clmulr (Zbc), which run_riscof.py excludes by name.
#
# The ISA string, the misa reset value and rvntt_csr.sv's MISA_VALUE must move
# together; tb/unit/test_isa_consistency.py checks that they do.
hart_ids: [0]
hart0:
  ISA: RV32IMZicsr_Zicond_Zba_Zbb_Zbkb_Zbs_Zkr_Zkt
  physical_addr_sz: 32
  User_Spec_Version: '2.3'
  supported_xlen: [32]
  misa:
    reset-val: 0x40001100      # MXL = 1 (RV32), extension bits I and M.
                               # not bit 1 (B): riscv-config 3.18.3 cannot
                               # express the letter and derives misa from
                               # single-letter extensions only.
    rv32:
      accessible: true
      mxl:
        implemented: true
        type:
          warl:
            dependency_fields: []
            legal:
              - mxl[1:0] in [0x1]
            wr_illegal:
              - Unchanged
      extensions:
        implemented: true
        type:
          warl:
            dependency_fields: []
            legal:
              - extensions[25:0] bitmask [0x0001100, 0x0000000]
            wr_illegal:
              - Unchanged
  # No PMP node: rvntt_csr.sv has neither pmpcfg* nor pmpaddr*, and accessing
  # one is an illegal-instruction trap.  Absence is how riscv-config 3.18
  # expresses "not implemented".
