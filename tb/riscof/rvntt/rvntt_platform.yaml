# Platform description for RISCOF.  The core has no timer and no NMI source --
# plan 1.5 defers interrupts entirely -- so both are marked absent rather than
# given plausible-looking addresses that nothing decodes.
mtime:
  implemented: false
mtimecmp:
  implemented: false
nmi:
  label: nmi_vector
reset:
  label: reset_vector
